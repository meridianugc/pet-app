name: iOS screens

on:
  push:
    branches:
      - cursor/pocket-pet-v1-5302

jobs:
  screens:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Boot an iPhone 16 simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          LINE=$(xcrun simctl list devices available | grep -E "iPhone 16 \(" | head -1 || true)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1)
          fi
          UDID=$(echo "$LINE" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Using $LINE"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "$UDID" > /tmp/sim-udid

      - name: Build Pocket Pet
        run: |
          set -euo pipefail
          xcodebuild \
            -project PocketPet.xcodeproj \
            -scheme PocketPet \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$(cat /tmp/sim-udid)" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch Star Defense and screenshot
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -name 'PocketPet.app' -type d | head -1)
          echo "App $APP"
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted com.example.petapp -starDefenseShot
          sleep 12
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun simctl io booted screenshot "$RUNNER_TEMP/screens/star-defense.png"
          ls -l "$RUNNER_TEMP/screens"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
